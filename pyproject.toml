[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "usecvislib-mcp"
version = "0.4.0"
description = "MCP server for USecVisLib security visualization library"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "VULNEX", email = "info@vulnex.com"},
]
keywords = ["mcp", "security", "visualization", "attack-tree", "threat-modeling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.0.0,<2",
    "uvicorn>=0.30.0,<1",
    "usecvislib>=0.3.4,<1",
]

[project.optional-dependencies]
dev = [
    "mcp[cli]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
]

[project.scripts]
usecvislib-mcp = "usecvislib_mcp.server:main"

[project.urls]
Homepage = "https://github.com/vulnex/usecvislib-mcp"
Repository = "https://github.com/vulnex/usecvislib-mcp"
Issues = "https://github.com/vulnex/usecvislib-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["usecvislib_mcp"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 75

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"src/usecvislib_mcp/server.py" = ["E402"]
